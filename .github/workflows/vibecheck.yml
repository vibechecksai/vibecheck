name: vibecheck

on:
  push:
  pull_request:

jobs:
  vibecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan for production failures
        run: python3 vibecheck.py . --fail-on critical || true
      - name: Fail on critical findings
        run: python3 vibecheck.py . --fail-on critical
